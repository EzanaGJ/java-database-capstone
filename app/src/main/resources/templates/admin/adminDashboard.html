
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard</title>

    <!-- CSS -->
    <link rel="stylesheet" th:href="@{/assets/css/adminDashboard.css}">
    <link rel="stylesheet" th:href="@{/assets/css/style.css}">

    <!-- Utility scripts -->
    <script th:src="@{/js/render.js}" defer></script>
    <script th:src="@{/js/util.js}" defer></script>

    <!-- Header and footer components -->
    <script type="module" th:src="@{/js/components/header.js}"></script>
    <script type="module" th:src="@{/js/components/footer.js}"></script>

    <!-- Admin dashboard -->
    <script type="module" th:src="@{/js/adminDashboard.js}"></script>

</head>

<body>

    <div class="container">
        <div class="wrapper">

            <!-- Header -->
            <div id="header"></div>

            <!-- Main content -->
            <main class="main-content">

                <section class="dashboard-heading">
                    <h1>Admin Dashboard</h1>
                    <p>Manage doctors and view their availability.</p>
                </section>

                <!-- Search and filters -->
                <section class="dashboard-controls">

                    <div class="search-container">
                        <input
                            type="text"
                            id="searchBar"
                            placeholder="Search by doctor name"
                        >
                    </div>

                    <div class="filter-container">

                        <select id="filterTime">
                            <option value="">Sort by time</option>
                            <option value="morning">Morning</option>
                            <option value="afternoon">Afternoon</option>
                        </select>

                        <select id="filterSpecialty">
                            <option value="">All Specialties</option>
                            <option value="cardiologist">Cardiologist</option>
                            <option value="dermatologist">Dermatologist</option>
                            <option value="neurologist">Neurologist</option>
                            <option value="pediatrician">Pediatrician</option>
                            <option value="orthopedist">Orthopedist</option>
                            <option value="gynecologist">Gynecologist</option>
                            <option value="psychiatrist">Psychiatrist</option>
                            <option value="dentist">Dentist</option>
                            <option value="ophthalmologist">Ophthalmologist</option>
                            <option value="ent">ENT Specialist</option>
                            <option value="urologist">Urologist</option>
                            <option value="oncologist">Oncologist</option>
                            <option value="gastroenterologist">Gastroenterologist</option>
                            <option value="general">General Physician</option>
                        </select>
                    </div>

                </section>

                <!-- Doctor cards -->
                <section id="content" class="doctor-list"></section>

            </main>

            <!-- Footer -->
            <div id="footer"></div>

        </div>
    </div>

    <!-- Add Doctor / Login Modal -->
    <div id="modal" class="modal" hidden>
        <div class="modal-content">

            <span id="closeModal" class="close">&times;</span>

            <div id="modal-body"></div>

        </div>
    </div>

</body>
</html>
