
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>

    <link rel="stylesheet" th:href="@{/assets/css/adminDashboard.css}">
    <link rel="stylesheet" th:href="@{/assets/css/style.css}">

    <script th:src="@{/js/render.js}" defer></script>
    <script th:src="@{/js/util.js}" defer></script>
    <script th:src="@{/js/components/header.js}" defer></script>
    <script th:src="@{/js/components/footer.js}" defer></script>
</head>

<body>
    <div class="container">
        <div class="wrapper">

            <div id="header"></div>

            <main class="main-content">
                <h2>Admin Dashboard</h2>

                <div class="search-filter-container">
                    <input
                        type="text"
                        id="searchBar"
                        placeholder="search by doctor name"
                    >

                    <div class="filter-section">
                        <select id="sortByTime" aria-label="Sort by time">
                            <option value="">Sort by time</option>
                            <option value="asc">Oldest first</option>
                            <option value="desc">Newest first</option>
                        </select>

                        <select id="filterBySpecialty" aria-label="Filter by specialty">
                            <option value="">All specialties</option>
                        </select>
                    </div>
                </div>

                <div id="content"></div>
            </main>

            <div id="footer"></div>

        </div>
    </div>

    <div id="modal" class="modal" hidden>
        <span id="closeModal" class="close">&times;</span>
        <div id="modal-body"></div>
    </div>

    <script type="module" src="/js/services/doctorServices.js"></script>
    <script type="module" src="/js/adminDashboard.js"></script>
    <script type="module" src="/js/components/doctorCard.js"></script>
</body>
</html>
