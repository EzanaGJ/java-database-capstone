
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DoctorDashboard</title>

    <link rel="icon" th:href="@{/assets/images/logo/logo.png}">
    <link rel="stylesheet" th:href="@{/assets/css/adminDashboard.css}">
    <link rel="stylesheet" th:href="@{/assets/css/doctorDashboard.css}">
    <link rel="stylesheet" th:href="@{/assets/css/style.css}">

    <script th:src="@{/js/render.js}" defer></script>
    <script th:src="@{/js/util.js}" defer></script>
    <script th:src="@{/js/components/header.js}" defer></script>
    <script th:src="@{/js/components/footer.js}" defer></script>
    <script th:src="@{/js/components/patientRows.js}" defer></script>
    <script type="module" th:src="@{/js/services/patientServices.js}"></script>
    <script th:src="@{/js/doctorDashboard.js}" defer></script>
</head>

<body>
    <div class="container">
        <div class="wrapper">

            <div id="header"></div>

            <main class="main-content">
                <h2>Doctor Dashboard</h2>

                <div class="search-filter-container">
                    <input
                        type="text"
                        id="searchBar"
                        placeholder="Search by patient name"
                        aria-label="Search patients"
                    >

                    <div class="filter-section">
                        <button id="todayAppointmentsBtn" type="button">
                            Today's Appointments
                        </button>

                        <input
                            type="date"
                            id="appointmentDate"
                            aria-label="Select appointment date"
                        >
                    </div>
                </div>

                <div class="table-container">
                    <table id="patientTable">
                        <thead>
                            <tr>
                                <th>Patient ID</th>
                                <th>Name</th>
                                <th>Phone</th>
                                <th>Email</th>
                                <th>Prescription</th>
                            </tr>
                        </thead>

                        <tbody id="patientTableBody">
                            <!-- Patient records are populated dynamically -->
                        </tbody>
                    </table>
                </div>
            </main>

            <div id="footer"></div>

        </div>
    </div>
</body>
</html>
